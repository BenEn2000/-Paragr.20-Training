    <script>
        const qaData = [{"q": "Wie kann ich einen rechten Winkel im Gelände konstruieren?", "a": "Mit der 3,4,5 - Regel. Wenn ich eine Seite 3m, eine Seite 4m lang mache, muss bei einem rechten Winkel zwischen diesen beiden Seiten die dritte Seite 5m lang sein.", "cat": 1}, {"q": "Welchen Zweck erfüllt eine technische Zeichnung und welche Zeichenelemente gibt es?", "a": "Es ist eine universell verständliche Darstellung eines Objektes. Es gibt: Kanten (durchgezogene Linie), nicht sichtbare Kanten (gestrichelte Linie), Flächen, Ecken, den Querschnitt (Vollkörper schraffiert, bei aneinander angrenzenden Körpern um 90° verstellte Schraffur)", "cat": 1}, {"q": "Welche Seiten eines Objektes werden bei der technischen Zeichnung dargestellt und wie werden sie projiziert?", "a": "Die Vorderansicht, Seitenansicht und Draufsicht. Die Projektion erfolgt in drei Quadranten. Oben links die Vorderansicht, rechts daneben die Seitenansicht (um 90° gedreht), unter der Vorderansicht die Draufsicht.", "cat": 1}, {"q": "Wie wird eine Koordinate im UTM- System geschrieben?", "a": "Eine UTM ist aufgebaut aus Zone, Rechtswert und Hochwert.\nZone: Besteht aus einer Zahl (Längenzone von 1 bis 60) und einem Buchstaben (Breitenband). '32U' ist beispielsweise eine typische Zone für große Teile Deutschlands.\n- Rechtswert / Ostwert (456789): Eine 6-stellige Zahl (in Metern). Im Englischen wird dies oft als Easting bezeichnet. Sie gibt die Position in Ost-West-Richtung innerhalb der Zone an.\n- Hochwert / Nordwert (5678901): Eine 7-stellige Zahl (in Metern). Im Englischen als Northing bezeichnet. Sie gibt die Entfernung zum Äquator in Nord-Süd-Richtung an.\nBeispiel: 32U 456789 5678901", "cat": 1}, {"q": "Was muss in einer technischen Zeichnung alles angegeben werden?", "a": "-Schriftfeld:  Maßstab, Werkstoff, Zeichner, Datum; -reale Längenangaben (Bemaßung), Maßzahl, Maßlinie, Maßpfeil (Messrichtungen), Maßhilfslinie (wenn überlappende Bemaßungen)", "cat": 1}, {"q": "Wieviel ist ein 1cm auf der Karte im Maßstab 1:1000, 1:25000, 1:50000?", "a": "-1:1000 : 1cm = 10m = 1000cm -> 1*10 = m, 1*1000 = cm\n-1:25000 : 1cm = 250m = 25000cm -> 1*250 = m, 1*25000 = cm\n-1:50000 : 1cm = 500m = 50000cm -> 1*500 = m, 1*50000 = cm", "cat": 1}, {"q": "Wieviel ist 1km² in ha und m²?", "a": "1km² = 100ha = 10000a = 1000000m²\n10000m² = 1ha", "cat": 1}, {"q": "Was bedeutet \"Niedere Vermessungskunde\"?", "a": "Vermessung in kleinen Gebieten, Erdoberfläche als Ebene", "cat": 1}, {"q": "Was ist ein Koordinatensystem?", "a": "Die eindeutige Position von Punkten in einem geometrischen Raum", "cat": 1}, {"q": "Was gehört in einen SiGe-Plan?", "a": "- Arbeitsabläufe -> Räumlich & Zeitlich\n- Gefährdungen\n- Maßnahmen zur Minimierung von Gefährdungen\n- Arbeitsschutzbestimmungen", "cat": 1}, {"q": "Welche Bodenarten werden unterschieden?", "a": "- geschüttete Böden\n- Bindige Böden (weichen auf)\n- nicht bindige Böden (weichen nicht auf)\n- gewachsener Fels", "cat": 1}, {"q": "Wie lautet die Klassifizierung von Kampfmitteln nach BFR-KMR?", "a": "A - ziviler Schrott\nB - militärischer Schrott\nC - Munitionsteile ohne Anhaftung\nD - Waffen + Waffenteile\nE - KM + Explosivstoff ohne Zünder\nF - KM + Explosivstoff mit Zünder\nG - KM + Explosivstoff + selbstdetonierende Zünder\nH - Brand-, Reiz-, Nebelstoff\nJ - Strahlende Substanzen\nK - Kampfstoffe", "cat": 1}, {"q": "Unter welchen Umständen fehlt die erforderliche, persönliche Eignung nach §8b SprengG?", "a": "- Geschäftsunfähig\n- Abhängigkeit von Alkohol oder Rauschmitteln\n- Verdacht auf unsachgemäßen Umgang", "cat": 1}, {"q": "Nach welchen Kriterien muss eine Räumstelle, zusätzlich zu den 14 Tagen vorangekündigt werden?", "a": "> 500 Personaltage\n> 30 Tage und mehr als 20 Beschäftigte", "cat": 1}, {"q": "Für wen gilt das SprengG laut §1a nicht?", "a": "- die obersten Bundes- und Landesbehörden\n- Bundeswehr und hier stationierte Streitkräfte\n- Polizei\n- Zollverwaltung\n- Kampfmittelbeseitigungsdienste\n- Bedienstete dieser Behörden, wenn sie dienstlich tätig werden\n- Bedienstete anderer Staaten -> wenn es eine Vereinbarung gibt", "cat": 1}, {"q": "Was regelt die zweite Verordnung zum Sprengstoffgesetz?", "a": "Die Verordnung regelt die Aufbewahrung von explosionsgefährlichen Stoffen", "cat": 1}, {"q": "Wie unterscheiden sich \"anerkannte Regeln der Technik\" und \"Stand der Technik\"?", "a": "Regeln: \n- von der Mehrheit anerkannt\n- wissenschaftlich begründet\n- praktisch erprobt\n- ausreichend bewährt\n\nStand:\n- enthält verfügbares Wissen\n- wissenschaftlich begründet\n- praktisch erprobt\n- ausreichend bewährt", "cat": 1}, {"q": "Wer ist grundsätzlich für die Beseitigung von Kampfmittel zuständig?", "a": "Die Länder\n- Polizei- und Ordnungsrecht\n- Ordnungsämter", "cat": 1}, {"q": "Wann kann eine Erlaubnis (§7) oder ein Befähigungsschein (§20) nach §34 widerrufen werden?", "a": "- Wenn sie hätten versagt werden müssen\n- Wenn nachträglich Tatsachen eintreten die zur Versagung hätten führen müssen", "cat": 1}, {"q": "Auf was ist bei der Lagerung von Munition zu achten? (§4, 2.SprengV)", "a": "- Munition mit Sprengstoff\n-> Munition mit brandfördernden Stoffen\n\n- Die klassischen Lagergruppen können nicht eingehalten werden, da bei Fundmunition der Zustand schlecht ist (ungenaue Interpretation) und die Verpackung fehlt.", "cat": 1}, {"q": "Wie groß ist der Brandschutzbereich um das Explosionsstoff-Lager?", "a": "- 25m\n- keine brennbaren Materialien\n- keine offenen Feuer\n- nicht Rauchen", "cat": 1}, {"q": "Was muss eine Betriebsanweisung enthalten?", "a": "- Gefährdungen\n- Bekanntmachen Räumstelle / Arbeitsplatz\n- Schutzmaßnahmen\n- Verhaltensregeln", "cat": 1}, {"q": "Wen hat der Arbeitgeber nach Grundsatz §1 zu Bestellen?", "a": "Den Räumstellenleiter", "cat": 1}, {"q": "Was regelt der Immissionsschutz?", "a": "Schutz vor schädlichen Einwirkungen für:\n- Menschen\n- Tiere\n- Umwelt\n- Wasser\n- Atmosphäre", "cat": 1}, {"q": "Wer ist am Arbeitsschutz beteiligt?", "a": "- Arbeitgeber & Arbeitnehmer\n- SiGeKo\n- Ersthelfer\n- Betriebsarzt", "cat": 1}, {"q": "Was ist nach Arbeitsschutzgesetz die wichtigste Aufgabe des AGs?", "a": "- Gefährdungsbeurteilung \n   -> Körperliche Unversehrtheit sicherstellen\n\n- Schutzmaßnahmen festlegen", "cat": 1}, {"q": "Welche Voraussetzungen muss eine verantwortliche Person im Kontext \"Arbeitsschutz\" erfüllen?", "a": "- Zuverlässigkeit\n- Fachkunde\n- schriftlich beauftragt\n- Eigenverantwortung", "cat": 1}, {"q": "Wie lautet SprengG §1 (1) ?", "a": "Dieses Gesetz regelt den Umgang und den Verkehr mit sowie die Einfuhr und die Durchfuhr von \n1. explosiongefährlichen Stoffen und\n2. Sprengzubehör", "cat": 1}, {"q": "Was gehört zu einer HGR?", "a": "- Standortchronik - Wie wurde die Fläche genutzt?\n- Verursacherszenarien\n- sekundäre Kampfmittelbelastung (Bodenbewegung)\n(-Kampfmittelräumungen) -> Bundesliegenschaften\n- Baumaßnahmen\n- Kostenwirkungsfaktoren -> (Eigentum... )\n- Kontaminationsverdacht\n- Darstellung / Bewertung (Karten)", "cat": 1}, {"q": "Was gehört in einem Arbeitsablaufplan? (Gliederung)", "a": "- Allgemeine Daten (AG, Beteiligte, HGR)\n- zu berücksichtigende Aspekte\n  -> (Genehmigungen, Karten, Sicherungsplan, Versorgung...)\n- durchzuführende Arbeiten\n  -> (Arbeitsbereiche, Verfahren...)\n- Personal und Geräte\n- Zeitansätze\n- Zusammenfassung", "cat": 1}, {"q": "Worauf muss bei dem Einsatz einer Richterschatulle gemäß $5, 2.SprengV geachtet werden?", "a": "- Bauartzulassung\n  -> ggf. nach Prüfung (BAM)\n- Genehmigung je Bundesland\n  -> auch die Schlösser\n- Kiste muss vor jeder Benutzung geprüft werden\n- Gefahrenpiktogramm muss Sichtbar sein", "cat": 1}, {"q": "Unter welchen Bedingungen kann eine Erlaubnis gemäß §7 nach §8 SprengG untersagt werden?", "a": "Der Antragsteller:\n- die Zuverlässigkeit nicht besitzt\n- die erforderliche Fachkunde nicht nachweist\n- die persönliche Eignung nicht besitzt\n- das 21. Lebensjahr nicht vollendet hat\n\nggf.: - nicht deutscher im Sinne des Artikels 116 Grundgesetz ist", "cat": 1}, {"q": "Worauf ist bei der Identifizierung von Fundmunition unbedingt zu achten?", "a": "- So wenig Personen wie möglich\n  -> so viele wie nötig\n- keine Lagerveränderung, bevor nicht eindeutig Identifiziert\n- im Zweifel zweite Meinung einholen\n- Datenbanken nutzen", "cat": 1}, {"q": "Welche Verursachungsszenarien gibt es?", "a": "- Luftangriff\n- Bodenkampf\n- Munitionsvernichtung\n- Militärischer Regelbetrieb\n- Munitionsproduktion / Lagerung", "cat": 1}, {"q": "Was besagt §19 SprengG?", "a": "- Verantwortliche Person sind\n1.) der Erlaubnisinhaber\n2.) Betriebsleitung / Räumstellenleiter\n  -> unselbstständige Zweigstelle\n3.) Fachtechnisches Aufsichtspersonal in der Kampfmittelsondierung", "cat": 1}, {"q": "Welche Dokumente sind täglich auf der Räumstelle zu aktualisieren?", "a": "- Bautagesberichte (Name, Bemerkung, Wetter, Arbeitszeiten, Leistungen, Geräte)\n- Parzellen - Aufmaßblatt (für BIMA)\n -> Kopfzeile (Name, Datum...)\n -> Zeichnung der Räumparzelle\n     -> und der Funde\n-> Erfassungsblatt nach BFR-KMR", "cat": 1}, {"q": "Welche Sicherungsmaßnahmen gibt es für tiefe Erdeingriffe", "a": "-über 1,25m Tiefe:\n -> komplettes Loch böschen\n -> differenz zwischen 1,25m bis 1,75m böschen / stützen\n-> Darüber hinaus Verbau", "cat": 1}, {"q": "Nach welchen Grundsätzen ist eine Kampfmittelräumung zu planen?", "a": "- Systematisch\n- Sorgfältig\n- Größtmögliche Sicherheit\n\n  => dazu Arbeitsablaufplanung", "cat": 1}, {"q": "Welche Quellen sind für die Historisch-Genetische Rekonstruktion einzubeziehen?", "a": "- Geländebegehung\n- Akten, Karten... (liegenschaftsbezogene Quellen)\n- Luftbilder\n- Sekundärquellen (Bücher, Internet)\n- Zeitzeugen\n- Digitales Geländemodell -> Krater", "cat": 1}, {"q": "Wieviel Nettoexplosivstoffmasse darf ich Lagern?", "a": "- Wir dürfen NICHT lagern!\n- man darf für den laufenden Arbeitstag insgesamt 25kg NEM aufbewahren\n   -> kann auf mehrere Richterschatullen verteilt werden", "cat": 1}, {"q": "Wie sind Lager gemäß 2.2.5 nach 2.SprengV gegen Diebstahl zu schützen?", "a": "- im Interesse der öffentlichen Sicherheit\n- ausreichend Schutz gegen Einbruchswerkzeuge\n- nicht mehr Schlüssel als nötig\n- Verantwortung von Räumstellenleiter\n\n  => min. Bauzaun", "cat": 1}, {"q": "Welche Gesetze befassen sich neben den SprengG mit dem Umgang mit Kampfmitteln?", "a": "(- DGUV -> kein Gesetz, aber Vorschriften)\n- ArbSChG\n- KrWaffG\n- ChemG\n- internationale Chemiewaffenübereinkommen (CWÜ)\n- WaffG", "cat": 1}, {"q": "Was beagt §7 des SprengG?", "a": "Wer gewerbsmäßig, selbstständig im Rahmen einer wirtschaftlichen Unternehmung oder eines Land- oder Forstwirtschaftlichenbetriebes oder bei der Beschäftigung von Arbeitgebern.\n1. mit explosionsgefährlichen Stoffen umgehen will oder\n2. den Verkehr mit explosionsgefährlichen Stoffen betreiben will bedarf einer Erlaubnis.", "cat": 1}, {"q": "Welche Räumverfahren unterscheidet die DGUV?", "a": "1. Vollflächige, punktuelle bodeneingreifende Kampfmittelräumung\n2. Räumung von Bombenblindgängern\n3. Kampfmittelräumung durch Abtrag von Boden\n4. Visuelle Kampfmittelräumung\n5. Baubegleitende Maßnahmen", "cat": 2}, {"q": "Was sind die Aufgaben des SiGeKo", "a": "- Planungsphase: \n   - Beratung; SiGe-Plan; Zusammenstellung der Unterlagen\n\n- Ausführungsphase: \n   - Kontrolle Arbeitssicherheit\n   - Anpassung SiGe-Plans\n   - Koordination der AGs", "cat": 1}, {"q": "Womit befasst sich die Arbeitsstättenverordnung?", "a": "- Sicherheit & Gesundheitsschutz beim Einrichten + Betreiben von Arbeitsstätten\n  -> Verkehrswege; Lager; Sanitärräume...", "cat": 1}, {"q": "Welche kampfmitteltechnische Maßnahme verstößt gegen §2 BaustellenV undwer ist verantwortlich?", "a": "- Baubegleitende Kampfmittelräumung\n   -> Bauherr steht in Verantwortung", "cat": 1}, {"q": "Wer hat und wie oft sind allgemeine Unterweisungen durchzuführen?", "a": "- Arbeitgeber\n-min. 1x jährlich während der Arbeitszeit\n  => Unterweisungen auf Räumstellen 1/4 jährlich", "cat": 1}, {"q": "Sind Betriebsärzte und Fachkräfte für Arbeitssicherheit verantwortlich?", "a": "- Nein, nur beratend tätig\n  => Verantwortlich ist §19 SprengG", "cat": 1}, {"q": "Ab wann ist ein Gehörschutz bereitzustellen und ab wann gibt es eine Gehörschutzpflicht?", "a": "LEX,8h >80 dB (A) + Lpc, peak > 135 dB (C)\n  -> Gehörschutz muss zur Verfügung stehen\n\nLEX, 8h >85dB (A) + Lpc, peak > 137 dB (C)\n -> Gehörschutzpflicht", "cat": 1}, {"q": "Wer benötigt einen Befähigungsschein nach §20 SprengG?", "a": "- Fachkundige Person\n  -> im Auftrag des Erlaubnisinhabers\n  -> für den Umgang mit Explosivstoffen", "cat": 1}, {"q": "Wer hat Verantwortung?", "a": "- jeder der Aufgaben hat\n -> Handlungsverantwortung\n     -> übertragene Handlungen ausführen\n -> Ergebnisverantwortung\n -> Führungsverantwortung\n\n=> Vorgesetzte immer mit Verantwortung", "cat": 1}, {"q": "Wann erlischt die Erlaubnis?", "a": "- Wenn Tätigkeit nicht innerhalb eines Jahres aufgenommen wurde\n- Wenn Tätigkeit 2 Jahre lang nicht ausgeübt wurde", "cat": 1}, {"q": "Wann sind Unterweisungen durchzuführen?", "a": "- Neueinstellung\n- Neue Räumstelle\n  -> vierteljährlich wiederholend\n- anhand der Betriebsanweisung\n -> bei Änderungen", "cat": 1}, {"q": "Nach welchen Hierarchien ist Arbeitsschutz zu gewährleisten?\n -> (Stellenwert der Maßnahmen)", "a": "1: S - Substitution => Ungefährliche Varianten bevorzugen\n2: T - Technische Maßnahmen => Sicherheitsscheiben etc...\n3: O - Organisatorische Maßnahmen => Regelmäßige Prüfungen\n4: P - Persönliche Maßnahmen => PSA...", "cat": 1}, {"q": "Wer besitzt keine erforderliche Zuverlässigkeit?", "a": "Personen mit:\n- min. 1 Jahr Freiheitsstrafe\n- mehrmaliger Verstoß gegen SprengG\n- Verstöße gegen Arbeits-, Waffengesetzt", "cat": 1}, {"q": "Welche Dokumente sind auf jeder Räumstelle mitzuführen?", "a": "- Befähigungsschein im Original\n- Erlaubnis im Original", "cat": 1}, {"q": "Ab wann ist ein Arbeitsunfall meldepflichtig?", "a": "- ab >3 Tagen ausfall\n   -> ArbSchG\n   -> bei Unfällen mit Explosivstoffen sofort -> SprengG", "cat": 1}, {"q": "Womit befasst sich das Arbeitsschutzgesetz?", "a": "Sicherheit & Gesundheitsschutz der Beschäftigten bei der Arbeit", "cat": 1}, {"q": "Wonach werden Lagergruppen unterteilt und welche gibt es?", "a": "> Schwere der potentiellen Schäden\n1.1 - in Masse explodieren\n1.2 - nicht in Masse explodieren\n1.3 - heftig abbrennend\n1.4 - einzeln brennend", "cat": 1}, {"q": "Wie oft muss Fundmunition abgefahren werden?", "a": "- täglich\n  -> Verantwortliche Person hat Sorge zu tragen\n\n-> alternativ Bewachung + sachgemäße Lagerung\n   -> VP & Behörde", "cat": 1}, {"q": "Was ist gemäß SprengG unverzüglich anzuzeigen?", "a": "- Einstellung des Betriebes\n- Bestellung & Abbestellung von Verantwortlicher Person\n- Abhandenkommen von Explosivstoffen\n- Unfälle beim Umgang mit Explosivstoffen\n- Verlust einer Erlaubnisausfertigung", "cat": 1}, {"q": "Was ist gemäß SprengG zwei Wochen im Voraus anzuzeigen?", "a": "- Aufgabe des Betriebes\n- Beginn der Sondierungsarbeiten", "cat": 1}, {"q": "Was ist der Gefahrenbereich?", "a": "Der Bereich in dem folgendes droht:\n - Gefahr für Leben von Mensch & Tier\n - Schäden an der Umwelt\n - Wird von Gefahrenabwehrbehörde festgelegt", "cat": 1}, {"q": "Was ist ein Schutzabstand", "a": "- Schutzabstände zum Lager\n- zum Schutz der Allgemeinheit oder Nachbarschaft\n- je nach Sicherungsmaßnahme variabel\n- TF ist verantwortlich", "cat": 1}, {"q": "Wozu dienen Sicherheitsabstände?", "a": "- Vermeidung von Gefahren\n- können Räumlich + Zeitlich sein", "cat": 1}, {"q": "Welche Hautkampfstoffe gibt es?", "a": "- Lost \n  -> S-Lost\n  -> N - Lost\n- Lewesit\n- Phosgenoxim\n\nSymptome: Hautrötung, Blasenbildung", "cat": 2}, {"q": "Welche Nervenkampfstoffe gibt es?", "a": "- Sarin\n- Soman\n- Tabun\n\nSymptome: Pupillenverengung\n  -> Schweiß, Speichelfluss...", "cat": 2}, {"q": "Nenne Beispiele für Brandstoffe", "a": "- Napalm\n- Thermit\n- Phosphor\n- Magnesium\n- Flammöle", "cat": 2}, {"q": "Welche Blutkampfstoffe gibt es?", "a": "- Blausäure\n- Chlorgas\n  => sehr flüchtig", "cat": 2}, {"q": "Wie wurde DR - Kampfstoffmunition im WW2 gekennzeichnet?", "a": "- Weißring -> Augenreiz\n- Blauring -> Nasenreiz\n- Grünring -> Lungen & Nerven\n- Gelbring -> Haut\n\n -> unterhalb Geschosskopf & Boden", "cat": 2}, {"q": "Wie wurden Kampfstoffe im WW1 gekennzeichnet? (DR)", "a": "Grünkreuz -> Lungenkampfstoff\nGelbkreuz -> Hauptkampfstoff\nBlaukreuz -> Nasen- Rachenkampfstoff", "cat": 2}, {"q": "Woran kann ich C-Munition erkennen?", "a": "- Flüssgkeitsaustritt\n- Ortsfremder Geruch\n- Hinweise auf Vergrabung\n- Boden- /Erdanomalien", "cat": 1}, {"q": "Welche Reizstoffe gibt es?", "a": "- Augen - Reizstoff\n- Nasen / Rachen Reizstoff\n- Kombinierte Reizstoffe\n\n=> Sollen Funktionsfähigkeit des Körpers beeinträchtigen", "cat": 2}, {"q": "Welche Prägungen gab es auf DR-Granaten mit Kampfstoffen und wo waren diese? (WW1)", "a": "Plus & grüne Farbe => auf Zünder\nPlus & Zahl => unterhalb Mundloch", "cat": 2}, {"q": "Was ist der Unterschied zwischen Kampfmittel und Kampfstoff?", "a": "Kampfmittel = - Gegenstände in denen Kampfstoff Transportiert werden kann\nKampfstoff = - Chemikalie / Gemisch\n   -> Flüssig, Fest, Gasförmig => dauerhaft tödlich", "cat": 2}, {"q": "Welche Kampfstoffe gibt es?", "a": "- Haut-Kampfstoff  => flüssig\n- Lungen-Kampfstoff  => flüssig\n- Blut-Kampfstoff  => flüssig, flüchtig\n- Nerven-Kampfstoff  => flüssig, flüchtig, sesshaft\n- Psycho-Kampfstoff  => fest, flüchtig", "cat": 2}, {"q": "Woran kann ich Werfermunition eindeutig identifizieren?", "a": "- Liederungsringe statt Führungsbänder\n  -> sind \"eingefräst\" anstatt aufgesetzt\n(- Flügelstabilisiert)", "cat": 2}, {"q": "Was ist typisch für deutsche Munition?", "a": "- Aluminium - Zünder\n- Führungsbänder aus Sintereisen\n  -> die Rosten", "cat": 2}, {"q": "Was ist typisch für amerikanische Munition?", "a": "- verschiedene Materialien für die Zünder\n- auffällig breite Führungsbänder aus Kupfer", "cat": 2}, {"q": "Welches Merkmal ist typisch für Raketen?", "a": "- Schuböffnung auf der Geschossunterseite\n -> Bei DOV in der Mitte (Wurfgranate 41)", "cat": 2}, {"q": "Welches Merkmal haben Nebel- Stielhandgranaten?", "a": "- Rauchabzugslöcher auf der Unterseite\n -> wenn verschlossen mit Blei- Zinn- Folie\n   -> Nebelstoff !", "cat": 2}, {"q": "Wo messe ich das Kaliber einer Wurfgranate?", "a": "- Am Leitwerk\n  -> Rohr", "cat": 2}, {"q": "Nach welchem Schema identifiziere ich die Munition?", "a": "- Munitionsart\n- Munitionssorte\n- Kaliber / Größenzuordnung\n- Nation\n- Zeit\n- Handhabungsfähig\n- Transportfähig\n- weitere Maßnahmen", "cat": 2}, {"q": "Was sind mögliche Identifizierungsmerkmale von Munition?", "a": "- Kaliber\n- Größe\n- Abmessungen / Proportionen\n- Einbauort des Zünders\n- Verwendete Werkstoffe", "cat": 2}, {"q": "Wie sieht der Aufbau einer Patrone aus?", "a": "- Geschoss\n- Treibladung\n- Hülse\n- Anzündhütchen\n\n -> Kleinkaliber als Ring (Randfeuerzünder)\n -> Größere Kaliber: Zentrales Anzündhütchen\n     -> Boxerzünder; Berdanzünder\n\n- Größen Größenangabe, Kaliber & Hülsenlänge", "cat": 2}, {"q": "Was ist \"Fundmunition\"?", "a": "Munition oder sprengkräftige Kriegswaffen, die nicht ununterbrochen verwahrt, überwacht und verwaltet worden sind.", "cat": 1}, {"q": "Was ist ein \"Anzündsystem\"?", "a": "- System zum Anzünden von Treibladungen\n- innerhalb eines Gerätes", "cat": 2}, {"q": "Was ist eine \"Anzündkette\"?", "a": "Eine nacheinander geschaltete Reihe von explosiven Komponenten", "cat": 2}, {"q": "Was ist ein Zünder?", "a": "- Bauteil von Munition\n- Enthält min. das erste Element der Zünd-/ Anzündkette\n- Wird durch äußere Einwirkung oder nachbestimmter Zeit ausgelöst\n- Löst die Wirkladung / zündet Sprengstoff", "cat": 2}, {"q": "Was ist die Aufgabe eines Zünders?", "a": "Der Zünder soll Munition\n  - zur gewünschten Zeit\n  - am gewünschten Ort\n  - in gewünschter Art\nsicher zur Wirkung bringen", "cat": 2}, {"q": "Wie werden Zünder unterteilt?", "a": "1. Ort der Anbringung (Art)\n2. Verwendung (Sorte)\n\nBeispiel: - Kopfzünder\n                -> Bombenkopfzünder", "cat": 2}, {"q": "Worin unterscheiden sich Zeitzünder und Annäherungszünder?", "a": "Zeit: Voreingestellte Zeit\n        -> Mechanisch Robust\n        -> nicht störbar\n        -> abhängig vom Zeitwerk\n             -> nicht alle Granaten detonieren in optimaler Höhe\nAnnäherung: über Radar\n        -> keine Einstellfehler\n        -> optimale Sprengpunkthöhe\n        -> empfindlicher & Störbar", "cat": 2}, {"q": "Welche Sicherheiten soll ein Zünder bieten?", "a": "- Konstruktive Sicherheit: während Produktion\n- Lagersicherheit\n- Transportsicherheit: für ordnungsgemäßen Transport\n- Handhabungssicherheit: ordnungsgemäße Handhabung\n- Rohr-, Masken-, Vorrohrsicherheit:\n     -> kein Auslösen im Rohr\n     -> kein Auslösen unmittelbar vor Rohr\n     -> kein Auslösen durch Tarnnetze\n- Detonatorsicherheit: -> gegen ungewolltes Auslösen", "cat": 2}, {"q": "Welche Sicherungselemente gibt es bei Zündern?", "a": "- Schutzkappen\n- Vorstecker: Handhabungs-, Transportsicherheit\n    -> vor Verwendung zu entfernen\n- Wickelband: Rohrsicherheit (Zentrifugalkraft / Trägheit)\n- Hemmwerk: bei Zeitzündern\n    -> Blockierendes Bauteil wird kontrolliert über Uhrwerk in Position gebracht\n- Sicherungskugeln: Rohrsicherheit & Zündersicherheit", "cat": 2}, {"q": "Was hilft gegen doppeltes Beladen bestimmter Werfer?", "a": "1. Rohrsicherheit\n2. Geschultes Personal\n3. Feuertakt angeben", "cat": 2}, {"q": "Wie können Zündnadeln verbaut sein?", "a": "- Starr\n- Vorgespannt: Zündnadel von Sicherung gehalten mit gespannter Feder hinter der Nadel\n- Federbelastet: Zündnadel auf Abstandsfeder auf Hülle aufgesetzt", "cat": 2}, {"q": "Was versteht man unter Ausbausperre?", "a": "- Vorrichtung, die die Wirkung der Munition auslöst, wenn versucht wird, den Zünder der Munition auszubauen", "cat": 2}, {"q": "Was ist besonders an dem Zünder \"Tail Pistol No.37\"?", "a": "- Britischer Langzeitzünder\n  -> Chemische Aktivierung\n\n- Aktivierungsstatus von außen nicht sichtbar\n  -> kann auch nach Jahrzenten plötzlich aktiv werden\n\n- Ausbausperre\n\n => Belastung & Bewegungunbedingt vermeiden", "cat": 2}, {"q": "Was ist an der \"kleinbombe SD2\" besonders?", "a": "- Mehrere Zünder können verbaut sein\n  -> ich kann nicht alle gleichzeitig sehen\n- alle Zünder sind hoch sensibel\n\n  = NICHT HANDHABUNGSFÄHIG !", "cat": 2}, {"q": "Welche Tätigkeiten werden dem Befähigungsscheininhaber gemäß §20 SprengG laut SprengG zugesprochen?", "a": "- Aufsuchen von Munition\n- Freilegen von Munition\n- Bergen von Munition\n- Aufbewahren von Munition", "cat": 1}, {"q": "Was muss bei der Riegelmiene 43 beachtet werden?", "a": "Sicherungssplint ist sehr locker\n  -> nicht handhabungsfähig", "cat": 1}, {"q": "Welches Problem gibt es bei der Tellermine 43", "a": "- Kopf-, Boden-, und Seitenzünder\n- Aufgeschraubter Deckel entsichert\n   -> niemals Deckel öffnen! Ausbausperre!\n- potentiell metallfrei\n   = Nicht handhabungsfähig", "cat": 2}, {"q": "Woran kann man die Zünder S/30 und S/30FG unterscheiden?", "a": "- S/30 hat einen Kronenförmigen Ring. der S/30FG einen einfachen Ring\n  -> S/30 ist nicht handhabungsfähig, der S/30FG kann handhabungsfähig sein", "cat": 2}, {"q": "Welche elementaren Bauteile hat Munition?", "a": "- Zünder\n- Wirkteil\n- Antrieb", "cat": 2}, {"q": "Was sind \"Explosionsgefährliche Stoffe\"?", "a": "- feste oder flüssige Stoffe / Gemische\n- die durch thermische, mechanische oder andere Beanspruchung explodieren\n- Gegenstände, die solche Stoffe enthalten", "cat": 1}, {"q": "Was ist \"unbrauchbare Munition\"?", "a": "- nicht verwendungsfähig\n  -> z.B. Beschädigt", "cat": 1}, {"q": "Was ist der Unterschied zwischen \"Anzünder\" und \"Zünder\"?", "a": "- Anzünder: Soll eine Ladung / einen Stoff entzünden\n- Zünder: Soll einen Stoff zur Detonation bringen", "cat": 2}, {"q": "Was ist eine \"Zündkette\"?", "a": "- Reihe von \"Explosiven Komponenten\"\n- Soll eine Detonation verursachen", "cat": 2}, {"q": "Was ist ein \"Blindgänger\"?", "a": "Munition die verschossen, aber nicht zur Wirkung gelangt ist\n  -> möglich bei Abwurfmunition, Projektilen und Eigenantrieb", "cat": 2}, {"q": "Was ist \"unbelastete Munition\"?", "a": "Munition, die uneingeschränkt verwendungsfähig ist", "cat": 1}, {"q": "Was ist eine \"patronierte Munition\"?", "a": "Alle Bauteile sind unlösbar miteinander verbunden", "cat": 1}, {"q": "Woran erkenne ich, dass eine Munition eine flüssige Wirkladung hat?", "a": "- Bei Bomben & Artillerie / Panzer & Wurfgranaten gibt es häufig Betankungsventile / Schrauben\n- eine äußere Identifizierung ist nicht immer möglich", "cat": 2}, {"q": "Was ist \"belastete Munition\"?", "a": "Munition die nicht uneingeschränkt verwendungsfähig ist", "cat": 1}, {"q": "Welche Sorten von Abwurfmunition gibt es?", "a": "- Brandbombe\n- Minenbombe\n- Nebelbombe\n- Sprengbombe\n- Splitterbombe\n- Betonbombe", "cat": 2}, {"q": "Welche Elemente haben Anzündkette & Zündkette und worin unterscheiden sie sich?", "a": "- Anzündkette: Anzündsatz -> Verzögerungssatz -> Übertragungssatz -> Verstärkungssatz\n => Deflagrierende Wirkung\n\nZündkette: Zündladung -> Verzögerungsladung -> Übertragungsladung -> Verstärkungsladung\n   => Detonierende Wirkung\nAnzündkette kann ggf. zur Zündkette werden.", "cat": 2}, {"q": "Wieso können scheinbar Handhabungsfähige Fundmunition dennoch gefährlich sein? (Chemie)", "a": "- Wasser & Metall & Amoniak = Pikratbildung\n   -> Schlag-/Stoßempfindlich  = Detonation\n- Bleiazid & Messing = Kupferazid\n   -> bei britischer Munition\n      -> sehr empfindlich\n- Instabile Treibladungspulver\n   -> Selbstentzündung bei Hitze", "cat": 2}, {"q": "Welche Sorten von Granaten- und Panzerabwehrhandwaffenmunition gibt es?", "a": "Gewehrgranaten: \n- Gewehr Panzergranate\n- Gewehr Sprenggranate\n\nHandgranaten:\n- Spreng\n- Splitter\n\nPanzerabwehrhandwaffenmunition:\n- Panzerfaust\n- Panzerbüchse", "cat": 2}, {"q": "Worin unterscheiden sich Kopfaufschlagzünder und Bodenaufschlagzünder?", "a": "Kopfaufschlagzünder:\n- Größere Sprengmasse\n- Schnellere Reaktion\n- Empfindlicher\n\nBodenaufschlagzünder:\n- Zündverzug -> Eindringtiefe\n- nach vorn gerichtete Wirkung\n- Größere Winkelempfindlichkeit\n- Härtung der Spitze möglich\n- zusätzliche Wirkstoffe möglich", "cat": 2}, {"q": "Welche Baugruppen hat ein Zünder?", "a": "- Energiequelle (mechanisch/thermisch/elektrisch)\n / Auslösesignal\n- (An)zündung\n- Wirkung", "cat": 2}, {"q": "Was ist eine \"sicherungseinrichtung\"?", "a": "Sie soll eine unbeabsichtigte Reaktion der nachfolgenden Explosivstoffe verhindern.", "cat": 2}, {"q": "Nach welchem System wird Natomunition gekennzeichnet / Beschriftet?", "a": "Nation (Deutsches Model), Modellnummer, Munitionssorte, Änderungen, Änderungen bis 1993\nDM 21 A1 (B1)\n => Dazu Farbcodes", "cat": 1}, {"q": "Welche Ziffern beschreiben die Munitionssorte bei Nato-Munition?", "a": "1 - Spreng-; Splitter-; Sprengbrand\n2 - Panzerspreng\n3 - Panzer\n4 - Brand\n5 - Nebel\n6 - Leucht\n7 - Beobachtung\n8 - Übung\n9 - Sonderzwecke\n0 - Exerzier", "cat": 2}, {"q": "Welche Farbkennung hat Natomunition?", "a": "Narzissengelb -> Sprengstoff\nRehbraun -> abbrennender Explosivstoff\nTiefschwarz -> panzerbrechend (Gilt nicht für Schrift)\nWeißgrün -> Nebel / Farb\nCremweiß -> Leucht (gilt nicht für Schrift)\nWeißaluminium -> Propaganda\nLichtblau -> Übung\nErdbeerrot - Brandstoff", "cat": 2}, {"q": "Welche Modelle der britischen MC 500 gibt es?", "a": "- MK1 -> 3-Teilig, 1x Öse\n- MK2 -> 2-Teilig, Heck aufgesetzt\n- MK3 -> 1-Teilig\n- MK4 -> 1-Teilig, verkürzt\n- MK6 -> 3-Teilig, 3x Öse\n- MK7 -> 2-Teilig, 3x Öse\n- MK8 -> 1-Teilig, 3x Öse\n- MK10 -> 1-Teilig, 3x Öse, geschlossene Spitze\n- MK11 -> 2-Teilig, 3x Öse, geschlossene Spitze\n- MK10 -> 3-Teilig, 3x Öse, geschlossener Boden\n\nGP500 (altes Model) -> Spindelförmig", "cat": 2}, {"q": "Was ist besonders an den Zündern der SD2?", "a": "Alle möglichen Zünder sind Federvorgespannt", "cat": 2}, {"q": "Wie werden brtische Mehrzweckbomben bezeichnet?", "a": "- Alt: General Purpose (GP)\n- Neu: Medium Capacity (MC)", "cat": 2}, {"q": "Wo ist der Unterschied zwischen Fuzes (Zünder) und Pistol?", "a": "Pistol:\n- rein mechanisch\n  -> kein explosivstoff (Anzündhütchen)\nFuze: - mit Explosivstoff\n  -> beides bei Bomben (britisch)", "cat": 2}, {"q": "Woran kann ich britische Bomben HC < 1000 lb erkennen?", "a": "Leitwerk hat Klipps", "cat": 2}, {"q": "Was ist \"Percusion\" und \"Friction\"?", "a": "Percusion: Zündung durch Schlag\nFriction: Zündung durch Reibung\n\n  -> Friction ist empfindlicher", "cat": 2}, {"q": "Auf was weißt eine längliche Öse an amerikanischen und britischen Bomben hin?", "a": "> 1000 lb", "cat": 2}, {"q": "Für welchen Sprengstoff gilt welche Farbkennung bei US-Bomben?", "a": "1x Gelber Ring = TNT & Amatol\n2x Gelber Ring = Comp B\n3x Gelber Ring = Tritonal", "cat": 2}, {"q": "Was ist \"Manöver Munition\"?", "a": "- Platzpatrone\n -> mit Treibladung\n -> ohne Projektil", "cat": 2}, {"q": "Welche Bauteile hat Abwurfmunition?", "a": "- Zünder (Front, Heck, Seiten (deutsch))\n- Bombenhülle\n- Wirkladung\n- Leitwerk\n- Aufhängevorrichtung\n- weitere Anbauteile", "cat": 2}, {"q": "Wie kann die Flugbahn von Munition stabilisiert werden?", "a": "- Drallstabilisiert\n  -> Führringe\n- Leitwerkstabilisiert\n- Flügelstabilisiert", "cat": 2}, {"q": "Was ist ein \"Versager\"?", "a": "- Munition die durch technisches Versagen nicht verschossen werden kann", "cat": 1}, {"q": "Was versteht man unter \"Anzünder\"?", "a": "- Gegenstand mit Explosivstoff\n- Zum Anzünden von Treibladungen\n- Meist mehrere Anzündmittel\n  -> Anzündkette", "cat": 2}, {"q": "Was ist \"Munitionsschrott\"?", "a": "Munitionsfragmente ohne Explosivstoff oder andere Füllungen und Anhaftungen", "cat": 2}, {"q": "Was bedeutet \"Inerte Munition\"?", "a": "Die Munition enthält keine gefährlichen Stoffe", "cat": 2}, {"q": "Wie ist eine Panzergranate aufgebaut und worin besteht der Unterschied zur Panzersprenggranate?", "a": "- Haube\n- Zentrierwulst\n- Geschosskörper (Zylindrischer Teil)\n- Führungsring(e)\n- Zapfen, ggf. mit Würgerille\n- Leuchtspur im Boden\n\n=> Keine Sprengladung, kein Zünder\n   -> Im Gegensatz zur Panzersprenggranate", "cat": 2}, {"q": "Wie kann Munition eingeteilt werden?", "a": "- In drei Abstufungen\n1. Teilstreitkraft (Heer, Marine, Luftwaffe)\n2. Art (Abwurf., Mienen, Rohrwaffenm., Werferm. ...)\n3. Sorte (Spreng, Brand, Nebel, Leucht...)", "cat": 2}, {"q": "Was bedeutet \"getrennte Munition\"?", "a": "- Geschoss, Treibladung, Treibladungsanzünder werden getrennt transportiert\n- nacheinander in die Waffe geladen", "cat": 2}, {"q": "Wie ist eine PAnzersprenggranate aufgebaut?", "a": "- Patroniert\n\n- Haube\n- Kappe\n- Zentrierwulst\n- Geschosshülle\n- Führungsband\n- Zapfen ggf. mit Würgerille\n- Bodenzünder, ggf. mit Leuchtspur\n- Innen: Sprengkapsel und Sprengladung", "cat": 2}, {"q": "Was ist eine \"Aufsteckmunition?", "a": "- Treibladungshülse und Geschoss werden getrennt produziert\n- Zusammenstecken unmittelbar vor Gebrauch", "cat": 2}, {"q": "Stelle Aggregatzustände und ihre Übergänge dar", "a": "GASFÖRMIG resublimiert zu FESToder kondensiert zu FLÜSSIG\nFLÜSSIG verdampft zu GASFÖRMIG oder erstarrt zu FEST\nFEST sublimiert zu GASFÖRMIG oder schmilzt zu FLÜSSIG", "cat": 2}, {"q": "Welche Sofortmaßnahmen sind bei C-Munition zu treffen?", "a": "1. Eigenschutz\n2. Ausbreitung eindämmen\n3. Arbeiten einstellen\n4. Melden -> Rst-Leiter\n5. Sammelpunkt aufsuchen\n6. ggf. säubern & zum Arzt", "cat": 1}, {"q": "Welche Gruppen von Nebelstoffen gibt es?", "a": "- kalten Nebel\n  -> chemische Reaktion\n  -> Aerosol\n\n- heißer Nebel\n  -> exotherme Reaktion (abbrand)\n  -> Rauch", "cat": 2}, {"q": "Welche Nebelstoffe gibt es?", "a": "- Nebelsäure\n- Nebelöle\n- feste Nebelstoffe", "cat": 2}, {"q": "Welche Lungenkampfstoffe gibt es?", "a": "- Phosgen\n- Diphosgen\n- Chlorpikrin", "cat": 2}, {"q": "Nenne Beispiele für Nebelstoffe", "a": "- Schwefeltrioxid\n- Hexachlorethan\n- weißer Phosphor\n- roter Phophor", "cat": 2}, {"q": "Nenne Beispiele für Augenreizstoffe", "a": "- Bromaceton\n- Chloraceton\n- w-Chloracetophenon (CN)\n- CS", "cat": 2}, {"q": "Nenne Nasen- und Rachenreizstoffe", "a": "- Adamsit\n- Clark I\n- Clark II\n- Clark III", "cat": 2}, {"q": "Worauf ist während der Durchführung der Arbeiten auf der Räumstelle zu achten? (->Räumstellenorganisation)", "a": "- Verhaltensregeln (Rauchverbot...)\n- Notfallplanung\n- Unterweisungen (Täglich, 1/4 Jährlich)\n- Schutzausrüstung\n- Dokumentation\n- Vorzulegende Nachweise\n- Betriebsanweisungen\n- Meldewesen (Wann, bei wem, Dokumente)", "cat": 1}, {"q": "Mit was befasst sich das SprengG", "a": "- Es regelt den Umgang, Verkehr und Einfuhr von explosionsgefährlichen Stoffen, soweit sie zur Verwendung als Explosivstoffe oder als pyrotechnische Sätze bestimmt\n- keine Munition für bestimmungsgemäßen gebrauch", "cat": 1}, {"q": "Welche Sorten Marinekampfmittel gibt es?", "a": "- Überwasser (Geschütz)\n- Unterwasser\n  -> Seeminen, Torpedos, Wasserbomben", "cat": 2}, {"q": "Welche Sorten von Minen gibt es?", "a": "- Panzerabwehrmine\n- Schützenmine\n- Glasmine", "cat": 2}, {"q": "Was ist \"Übungsmunition\"?", "a": "- ähnliches Verhalten zur \"originalen\" Munition\n  -> günstigere Herstellung\n    -> Ballistisches\n- für Ausbildungszwecke", "cat": 1}, {"q": "Welche Sorten von Flugabwehrkanonenmunition gibt es?", "a": "- Brandschrapnellgeschoss\n- Minengeschoss\n- Splittergeschoss\n...", "cat": 2}, {"q": "Welche Sorten der Artillerie- und Panzermunition gibt es?", "a": "Brandschrapnellgranate\nPanzergranate\nPanzersprenggranate\nNebelgranate\nHohlladungsgranate", "cat": 2}, {"q": "Welche Sorten von Flugzeugbordwaffenmunition gibt es?", "a": "Brandgranatpatronen\nBrandsprenggranatpatronen\nSprenggranatpatronen\nPanzergranatpatronen\n\n => siehe Handwaffen", "cat": 2}, {"q": "Welche Sorten von Wurfgranaten / Werfermunition gibt es?", "a": "Brand\nLeucht\nNebel\nSpreng", "cat": 2}, {"q": "Welche Arten von Munition gibt es?", "a": "Munition für Hand- und Maschinenwaffen\nArtillerie und Panzermunition\nFlugabwehrkanonenmunition\nFlugzeugbordwaffenmunition\nWurfgranaten\nAbwurfmunition\nMinen\nSprengmittel  II - Marinekampfmittel\nPionierkampfmittel\nGranaten & Panzerabwehrhandwaffenmunition\nPyrotechnische Munition\nRaketen\nRadioaktive- , Chemische-, Biologische Munition", "cat": 2}, {"q": "Welche Sorten der Munition für Hand- und Maschinenwaffen gibt es?", "a": "Spitzgeschoss (mit Kern)\nBeobachtungspatrone\nPhosphor mit Kern\nBrandgranate\nBrandsprenggranate\nPanzersprenggranate\n...", "cat": 2}, {"q": "Auf was sollte bei der Geländeerkundung im Vorfeld der Räumstelle geachtet werden?", "a": "- Nutzungsart:\n   - Infrastruktur -> Metalle\n   - Industriell -> Metalle\n   - Landwirtschaftlich -> Aufschüttung\n      => Welche Probleme ergebensich?\n- Grundwasser\n- Bodenbedeckung\n- Störeinflüsse im Boden (Kabel, Schächte, ...)", "cat": 1}, {"q": "Worauf ist bei der Testfelderkundung zu achten?", "a": "Alle auf der Räumstelle vorherschenden Bedingungen müssen betestet werden\n=> Erst dann aussagekräftig", "cat": 1}, {"q": "Worauf ist bei Erdeingriffen zu achten?", "a": "- Leitungen Prüfen\n60cm Schutzstreifen um Grube\nMindestgrabenbreite\nStandsicherheit (Störungen, Grundwasser...)\nmax. 1,25m tief ohne weitere Schutzmaßnahmen", "cat": 1}, {"q": "Wann wird Fundmunition geborgen und worauf ist zu achten?", "a": "nach zweifelsfreier Identifikation als handhabungsfähig\nohne Kraft, Druck, Stoß\nmit Vorsicht & Sorgfalt", "cat": 1}, {"q": "Wie wird mit nicht handhabungsfähiger Munition umgegangen?", "a": "Identifizierung durch verantwortliche Person\nverbleib in Fundposition\nRäumdienst informieren, Bereich sperren\n   -> Nach Absprache mit Räumdienst ggf. Verlagerung innerhalb der Räumstelle", "cat": 1}, {"q": "Von wem wird die Transportfähigkeit festgestellt?", "a": "ausschließlich staatliche Stellen", "cat": 1}, {"q": "Welche Flächenkategorien gibt es? (HGR)", "a": "1. Verdacht nicht bestätigt -> kein Handlungsbedarf\n2. Kampfmittel vermutet -> Weiterer Erkundungsbedarf\n3. Kampfmittelbelastung ohne Gefährdung\n    -> Neubewertung bei Nutzungsänderung\n4. Kampfmittelbelastung mit Gefährdung\n    -> Beseitigung erforderlich\n5. Kampfmittel vollständig beseitigt", "cat": 1}, {"q": "Welche Arbeiten sind nach DGUV im Rahmen der Kampfmittelräumung durchzuführen?", "a": "1. Einrichten der Räumstelle\n2. Herstellen der Räumfähigkeit\n3.Vermessen\n4. Sondieren\n5. Freilegen\n6. Identifizieren\n7. Bergen\n8. Transport innerhalb der Räumstelle\n9. Aufbewahren\n10. Überlassen", "cat": 1}, {"q": "Was ist Munition?", "a": "- Gegenstände für die bestimmungsgemäße militärische Anwendung\n- mit:\nExplosiv-, Brand-, Nebel-, Reizstoff oder chemischen Kampfstoffen", "cat": 2}, {"q": "Was sollte zuerst geprüft werden, bevor ich die Munition identifiziere?", "a": "- Munition, Teil oder Schrott\n  -> Anhaftungen?\n\n- Belastet / Unbelastet (Blindgänger)\n- Nässt die Munition?", "cat": 2}, {"q": "Welche Fundklassen gibt es?", "a": "DA = Waffen & Teile\nEA = Kampfmittel mit Explosivstoff ohne Zünder\nFA = Kampfmittel mit Explosivstoff und Zünder \nGA = Kampfmittel mit Explosivstoff und selbstdetonationsfähigem Zünder\nHA = Brand-, Reiz-, Nebelstoff\nJA = Strahlende Substanzen\nKA = Kampfstoffe", "cat": 2}, {"q": "Welche Kontrollen sind nach DGUV von der verantwortlichen Person durchzuführen?", "a": "- Durchführungskontrolle\n- Wirksamkeitskontrolle\n- Erhaltungskontrolle", "cat": 1}, {"q": "Welche Grundpflicht hat der Arbeitgeber?", "a": "Arbeitsschutz\n-> diesen auf Wirksamkeit prüfen", "cat": 1}, {"q": "Was beinhaltet die Gefährdungsbeurteilung?", "a": "Vor beginn der Arbeiten zu erstellen\n-> Beurteilung von Gefährdungen\n-> Festlegen von Schutzmaßnahmen\n-> Wirksamkeitsüberprüfung\n-> Dokumentation", "cat": 1}, {"q": "Beispiele für die vier verschiedenen Kategorien von Schutzmaßnahmen", "a": "Substitution: eine weniger gefährlichen Arbeitsmethode mit gleichem Ergebnis finden\nTechnisch: Schutzverglasung, Belüftung....\nOrganisatorisch: Zugangsberechtigung, Rettungswege...\nPersönlich: PSA, Sonnencreme..", "cat": 1}, {"q": "Was ist nach DGUV-Richtlinien teil der Gefährdungsbeurteilung?", "a": "1. Informationsermittlung\n-> Arbeitsabläufe / Arbeitsschritte\n-> zu erwartende Kampfmittel\n-> Arbeitbereiche\n2. Abschätzung der Gefährdung\n3. Festlegung der Maßnahme\n4. Dokumentation\n5. Kontrolle & Bewertung", "cat": 1}, {"q": "Wann entsteht aus einem Kampfmittelverdacht eine Gefahrenquelle?", "a": "Bei mechanischer Belastung", "cat": 1}, {"q": "Ab wie viel Nettoexplosivstoff je Kampfmittel müssen erhöhte SIcherheitsstandards vorgenommen werden?", "a": "100g\n-> Danach ist der Schutz durch Panzerglas nicht mehr gegeben", "cat": 2}, {"q": "Worin unterscheiden sich \"Abbrand\", \"Deflagration\", \"Detonation\"", "a": "Abbrand: \n- langsam, bis 1m/s\n\nDeflagration: \n- schnell, weniger als Schallgeschwindigkeit\n- Zerplatzen des Objektes\n   -> große Splitter\n\nDetonation:\n- sofortiges Umsetzen\n   -> größer Schallgeschwindigkeit\n- viele kleine Splitter", "cat": 2}, {"q": "Wer definiert auf einer Räumstelle die abzutragende Schichtmächtigkeit?", "a": "Die verantwortliche Person", "cat": 1}, {"q": "Was ist der Geltungsbereich der BFR KMR?", "a": "Die Richtlinien gelten für Bundesliegenschaften im Verantwortungsbereich des BMF (mit BImA), BMVg und BMDV.", "cat": 1}, {"q": "Werden chemische Kampfstoffe in den BFR KMR behandelt?", "a": "Nein, die Erkundung und Räumung chemischer Kampfstoffe wird nicht behandelt.", "cat": 1}, {"q": "Welche Richtlinien gelten für Boden- und Grundwasserverunreinigungen durch Kampfmittel?", "a": "Dafür gelten die Baufachlichen Richtlinien Boden- und Grundwasserschutz (BFR BoGwS).", "cat": 1}, {"q": "Was ist das übergeordnete Ziel der BFR KMR?", "a": "Eine der Gefahr angemessene, einheitliche, kostengünstige und nachhaltige Kampfmittelräumung zu gewährleisten.", "cat": 1}, {"q": "Wie werden Produkte aus anderen EU-Staaten im Rahmen der BFR KMR behandelt?", "a": "Sie werden als gleichwertig behandelt, wenn sie dauerhaft das geforderte Schutzniveau (Sicherheit, Gesundheit, Gebrauchstauglichkeit) erreichen.", "cat": 1}, {"q": "Was versteht man unter einem 'Befähigungsscheininhaber'?", "a": "Eine Person, die einen Befähigungsschein nach § 20 Sprengstoffgesetz (SprengG) zum Umgang mit Kampfmitteln besitzt.", "cat": 1}, {"q": "Wie werden 'Blindgänger' definiert?", "a": "Kampfmittel, die zündfertig gemacht, abgeworfen, verschossen oder verlegt wurden und aufgrund eines Versagens nicht zur Wirkung gelangten.", "cat": 2}, {"q": "Was sind 'Brandstoffe' im Sinne der BFR KMR?", "a": "Chemische Verbindungen oder Gemische, die hohe Verbrennungstemperaturen entwickeln, lange brennen, gut haften und schwer zu löschen sind.", "cat": 1}, {"q": "Wie definiert das Dokument 'chemische Kampfstoffe'?", "a": "Toxische Substanzen, die wegen ihrer Wirkung für Kriegszwecke verwendet wurden und die Kampfkraft des Gegners schwächen sollen.", "cat": 2}, {"q": "Was bedeutet 'Detonation'?", "a": "Eine besonders starke Explosion.", "cat": 2}, {"q": "Was ist unter dem Begriff 'Erkundung' zu verstehen?", "a": "Die Ermittlung einer möglichen Belastung durch Kampfmittel in einem definierten Erkundungsgebiet.", "cat": 1}, {"q": "Welches Ziel verfolgt die Gefährdungsabschätzung?", "a": "Eine Verdachtsfläche oder einen Fundpunkt entweder aus dem Verdacht zu entlassen oder als kampfmittelbelastet festzustellen, zu charakterisieren und Entscheidungen vorzubereiten.", "cat": 1}, {"q": "Wer gilt als 'Fachkundiger Munition'?", "a": "Ein Befähigungsscheininhaber mit Fachkundenachweis durch einen staatlichen oder staatlich anerkannten Grundlehrgang.", "cat": 1}, {"q": "Was sind 'Kampfmittel' gemäß den BFR KMR?", "a": "Gewahrsamslos gewordene, zur Kriegsführung bestimmte Gegenstände militärischer Herkunft, die z.B. Explosivstoffe, Brandstoffe enthalten oder Kriegswaffen sind.", "cat": 2}, {"q": "Welche wesentlichen Schritte umfasst das Ablaufschema der Kampfmittelbeseitigung?", "a": "Erkundung/Planung (Phase A und B), Räumkonzept, eigentliche Räumung (Bergen, Identifizieren, Transport) und schließlich Vernichtung.", "cat": 1}, {"q": "Was muss zum Nachweis der 'Kampfmittelfreiheit' erbracht werden?", "a": "Unter anderem ein Abschlussprotokoll, Angaben zu Suchmethoden, Auflistung geborgener Kampfmittel, reproduzierbare Lagepläne und sprengstoffrechtliche Zulassungen.", "cat": 1}, {"q": "Wer führt im Regelfall die Vernichtung der Kampfmittel durch?", "a": "Der zuständige Kampfmittelbeseitigungsdienst des Landes.", "cat": 1}, {"q": "Was versteht man unter 'Sondieren'?", "a": "Es ist ein Teil der Kampfmittelbeseitigung zur Detektion bzw. Ortung potenzieller Kampfmittel.", "cat": 1}, {"q": "Gilt gefundene Munition grundsätzlich als transportfähig?", "a": "Nein, Kampfmittel gelten grundsätzlich als nicht handhabungsfähig und nicht transportfähig, bis ein Fachkundiger Munition sie freigibt.", "cat": 1}, {"q": "Welche 'Verantwortlichen Personen' unterscheidet § 19 des Sprengstoffgesetzes (SprengG)?", "a": "Den Erlaubnisscheininhaber/Betriebsinhaber, die mit der Leitung beauftragte Person und das Fachtechnische Aufsichtspersonal.", "cat": 1}, {"q": "Wer ist nach dem Grundgesetz (Art. 30, 83) grundsätzlich für die Kampfmittelbeseitigung zuständig?", "a": "Die Länder, da dies zur polizeilichen Gefahrenabwehr gehört.", "cat": 1}, {"q": "Dürfen Ordnungsbehörden der Länder uneingeschränkt auf militärisch genutzten Liegenschaften der Bundeswehr räumen?", "a": "Nein, da dies in hoheitliche Befugnisse des Bundes eingreift, es sei denn, die Bundeswehr ersucht um Amtshilfe oder die Liegenschaft wurde aufgegeben.", "cat": 1}, {"q": "Wer trägt gemäß Staatspraxis die Kosten für die Beseitigung ehemals reichseigener Kampfmittel auf Bundesliegenschaften?", "a": "Der Bund trägt diese Kosten unabhängig von der Herkunft der Kampfmittel.", "cat": 1}, {"q": "Wer trägt in der Regel die Kosten für alliierte Weltkriegsmunition auf nicht-bundeseigenen Privatgrundstücken?", "a": "Die Länder, soweit nicht spezielle Unterstützungsrichtlinien des Bundes greifen.", "cat": 1}, {"q": "Findet das Sprengstoffgesetz (SprengG) Anwendung auf Kampfmittelbeseitigungsdienste der Länder?", "a": "Nein, gemäß § 1 Abs. 4 Nr. 1 SprengG sind diese ausgenommen; für sie gilt spezielles Landesrecht.", "cat": 1}, {"q": "Unterliegen gewerbliche Kampfmittelräumfirmen dem Sprengstoffgesetz?", "a": "Ja, für den gewerbsmäßigen Umgang, Verkehr und Transport von Explosivstoffen sind Erlaubnisse nach § 7 und Befähigungen nach § 20 zwingend.", "cat": 1}, {"q": "Was besagt § 20 SprengG?", "a": "Dass verantwortliches Personal und Aufsichtspersonen in der Räumung einen behördlichen Befähigungsschein benötigen.", "cat": 1}, {"q": "Was fordert das Kriegswaffenkontrollgesetz (KrWaffG) von einem Finder?", "a": "Die unverzügliche Anzeige des Fundes bei den zuständigen Behörden oder Dienststellen.", "cat": 1}, {"q": "Dürfen private Firmen ohne Genehmigung mit chemischen Waffen (Liste 1) umgehen?", "a": "Nein, wer ohne Genehmigung die tatsächliche Gewalt darüber ausübt, macht sich strafbar (Polizeien und Bw sind ausgenommen).", "cat": 1}, {"q": "Gibt es ein spezielles Gesetz zum Arbeitsschutz in der Kampfmittelräumung?", "a": "Nein, es gelten das Arbeitsschutzgesetz und spezifische DGUV-Regeln und Informationen (z.B. DGUV Information 201-027).", "cat": 1}, {"q": "Welche Bundesanstalt ist bei zivilen Bauaufgaben auf Bundesliegenschaften des Geschäftsbereichs BMF meist federführend?", "a": "Die Bundesanstalt für Immobilienaufgaben (BImA).", "cat": 1}, {"q": "Wer koordiniert militärische Kampfmittelräumungen bei investiven Baumaßnahmen der Bundeswehr?", "a": "Die Abteilung Infrastruktur des BAIUDBw (insbesondere KompZ BauMgmt).", "cat": 1}, {"q": "In welchem IT-System wird die Digitale Bestandsdokumentation KMR für den Bund geführt?", "a": "Im Informationssystem Boden- und Grundwasserschutz (INSA).", "cat": 1}, {"q": "Welche Aufgaben hat die Leitstelle des Bundes für Kampfmittelräumung im NLBL?", "a": "Unter anderem Qualitätssicherung, Fachberatung, Datenmanagement im INSA und Erarbeitung methodischer Konzepte.", "cat": 1}, {"q": "Was muss bei der Rückgabe von Übungsplätzen der Bundeswehr an die BImA beachtet werden?", "a": "Die Bundeswehr muss an der Oberfläche sichtbare Kampfmittel auf Wegen beseitigen und Warnschilder aufstellen; eine teure flächendeckende Tiefenräumung ist anfangs meist nicht vorgesehen.", "cat": 1}, {"q": "Woraus besteht Phase A im Phasenschema Kampfmittelräumung?", "a": "Aus der Historischen Erkundung der möglichen Kampfmittelbelastung und deren Bewertung.", "cat": 1}, {"q": "Woraus besteht Phase B im Phasenschema Kampfmittelräumung?", "a": "Aus der Technischen Erkundung der Kampfmittelbelastung und der Gefährdungsabschätzung.", "cat": 1}, {"q": "Was wird in Phase C1 der Kampfmittelräumung gemacht?", "a": "Das Erstellen eines Räumkonzepts sowie die Ausschreibung und Vergabe der Kampfmittelräumung.", "cat": 1}, {"q": "Was umfasst Phase C2?", "a": "Die praktische Durchführung der Kampfmittelräumung, die Abnahme und die Abschlussdokumentation.", "cat": 1}, {"q": "Was sind die zentralen Quellen einer Historisch-genetischen Rekonstruktion (HgR-KM)?", "a": "Archivalien, Luftbilder, aktuelle Dokumente (Räumberichte) sowie Zeitzeugenbefragungen.", "cat": 1}, {"q": "Welche Behörde führt Archivrecherchen und Luftbildbeschaffung für Bundesbehörden oft zentral durch?", "a": "Das Niedersächsische Landesamt für Bau und Liegenschaften (NLBL).", "cat": 1}, {"q": "Was sind 'Kostenwirkungsfaktoren' in der Räumplanung?", "a": "Informationen über Standortbedingungen, Kampfmittelspezifika und rechtliche Faktoren, die Einfluss auf Verfahren und Kosten haben.", "cat": 1}, {"q": "Nennen Sie Beispiele für rechtliche Faktoren (als Kostenwirkungsfaktoren).", "a": "Eigentumsverhältnisse, Natur- und Denkmalschutz, Totenruhe.", "cat": 1}, {"q": "Was passiert am Ende von Phase A, wenn der Kampfmittelverdacht ausgeräumt ist?", "a": "Die Maßnahme schließt mit der Dokumentation (Kategorie 1); es besteht kein weiterer Handlungsbedarf.", "cat": 1}, {"q": "Was ist das Hauptziel von Phase B (Technische Erkundung)?", "a": "Die liegenschaftsspezifische Gefährdungsabschätzung der Kampfmittelbelastung.", "cat": 1}, {"q": "Welche geophysikalischen Verfahren kommen in Phase B meist zum Einsatz?", "a": "Magnetik, Elektromagnetik (TDEM) und Georadar.", "cat": 1}, {"q": "Warum führt man in Phase B Räumungen in Testfeldern durch?", "a": "Um Art, Zustand, Verteilung und Menge der Kampfmittel, geologische Störfaktoren sowie Bodenbeschaffenheiten praktisch zu ermitteln.", "cat": 1}, {"q": "Muss bei einer Nutzungsänderung auf ehemals bewerteten Flächen neu geprüft werden?", "a": "Ja, geht von Kampfmitteln keine Gefahr bei aktueller Nutzung aus, muss bei Nutzungsänderung (z.B. Bauvorhaben) eine Neubewertung erfolgen.", "cat": 1}, {"q": "Welche drei grundlegenden Lösungsmöglichkeiten gibt es im Räumkonzept?", "a": "Kampfmittelräumung ohne Einschränkungen, mit Einschränkungen, oder Schutz- und Beschränkungsmaßnahmen.", "cat": 1}, {"q": "Was sind die operativen Schritte der Phase C2 (Räumung)?", "a": "Räumfähigkeit herstellen, Sondieren, Freilegen, Identifizieren, Bergen, Transport in Bereitstellungslager, Übergabe zur Vernichtung.", "cat": 1}, {"q": "Wozu dienen Prüffelder während der Kampfmittelräumung?", "a": "Der stichprobenartigen Qualitätskontrolle der Räumleistung durch den Auftraggeber.", "cat": 1}, {"q": "Warum ist eine baubegleitende Kampfmittelräumung in stark bebauten Gebieten oft nötig?", "a": "Da enge Bebauung, Versorgungsleitungen oder hoher anthropogener Schrottanteil eine flächige geophysikalische Vorabsondierung unmöglich machen.", "cat": 2}, {"q": "Darf man Gebäude abreißen, ohne die Kampfmittelsituation im Untergrund zu prüfen?", "a": "Nein, vor Freilegungs- oder Rückbauarbeiten muss die Situation mindestens auf dem Stand der Phase A geklärt sein.", "cat": 1}, {"q": "Was ist die Gefahr bei der Volumenräumung (Separation) auf Flächen mit Bodenkontaminationen?", "a": "Sprengstoffspezifische Verbindungen (STV) könnten mobilisiert werden und das Grundwasser kontaminieren.", "cat": 1}, {"q": "In welche Kategorie wird eine Fläche eingestuft, auf der sich der Verdacht nicht bestätigt hat?", "a": "In die Kategorie 1.", "cat": 1}, {"q": "Welche Bedeutung hat Kategorie 4 in der Flächenbewertung?", "a": "Die festgestellte Kampfmittelbelastung stellt eine aktuelle Gefährdung dar, die eine sofortige oder geplante Beseitigung erfordert.", "cat": 1}, {"q": "Was besagt Kategorie 5 in der Flächenbewertung?", "a": "Die festgestellte Kampfmittelbelastung wurde vollständig geräumt.", "cat": 1}, {"q": "An welche Planungsphasen der HOAI ist die Erstellung des Räumkonzepts angelehnt?", "a": "Grundlagenermittlung, Vorplanung, Entwurfsplanung und Genehmigungsplanung.", "cat": 1}, {"q": "Sind Leistungen zur Kampfmittelräumung im Regelfall als Bauleistungen einzustufen?", "a": "Ja, sie stehen meist im Zusammenhang mit Bauvorhaben und umfassen Erd-, Tief- und Sondierungsarbeiten, weshalb die VOB Anwendung findet.", "cat": 1}, {"q": "Was ist der Zweck der VOB/A bei der Vergabe von Kampfmittelräumungen?", "a": "Einen transparenten und wirtschaftlichen Wettbewerb unter Beachtung rechtlicher Rahmenbedingungen sicherzustellen.", "cat": 1}, {"q": "Dürfen originäre 'Bauherrenaufgaben' bei der Projektleitung an Externe delegiert werden?", "a": "Nein, Anordnungen, Entscheidungen und Aufgaben, die finanzielle Rechtsfolgen auslösen, obliegen dem öffentlichen Bauherrn.", "cat": 1}, {"q": "Kann ein öffentlicher Bauherr freiberufliche Projektsteuerer einschalten?", "a": "Ja, zur Unterstützung bei organisatorischen, technisch-wirtschaftlichen Steuerungsaufgaben (übertragbare Bauherrenaufgaben).", "cat": 1}, {"q": "Wie erfolgt die Abrechnung von Ingenieurleistungen für Phase A und B?", "a": "Durch Leistungskataloge und freie oder in Anlehnung an die HOAI getroffene Honorarvereinbarungen, da es oft keine zwingenden HOAI-Leistungsbilder dafür gibt.", "cat": 1}, {"q": "Dürfen Stundenlohnverträge für große Flächenräumungen abgeschlossen werden?", "a": "Nein, nur für Bauleistungen geringen Umfangs, die überwiegend Lohnkosten verursachen. In der Regel sollen Leistungsverträge (Einheitspreise) genutzt werden.", "cat": 1}, {"q": "Aus wie vielen Stufen besteht die formelle Angebotswertung nach VOB/A in der Regel?", "a": "Aus 4 Stufen (sachliche Prüfung, Eignungsprüfung, Preis-Leistungs-Verhältnis, Wirtschaftlichkeit).", "cat": 1}, {"q": "Wie lange muss die Dokumentation über erfolgte Kampfmittelräumungen aufbewahrt werden?", "a": "Sie ist durch den Auftraggeber (z.B. BImA, Bundeswehr) unbefristet aufzubewahren, um Rechtssicherheit zu gewähren.", "cat": 1}, {"q": "Was ist das Kernziel der Historisch-genetischen Rekonstruktion (HgR-KM)?", "a": "Die historische Nutzung und angriffsbedingte Kampfmittelbelastung räumlich und zeitlich differenziert nachzuweisen und zu bewerten.", "cat": 1}, {"q": "Aus welchen Teilen besteht in der Regel die 'Standortchronik'?", "a": "Aus der Nutzungschronik, der Angriffschronik und der Handlungschronik (Regelbetrieb/Unfälle).", "cat": 1}, {"q": "Was ist ein 'sekundäre Kampfmittelbelastung'?", "a": "Kampfmittel, die unwissentlich durch Erdbewegungen (z.B. Aushub in der Nachkriegszeit) von ihrem Ursprungsort an eine ehemals saubere Stelle verlagert wurden.", "cat": 1}, {"q": "Was versteht man unter dem 'Provenienzprinzip' im Archivwesen?", "a": "Ein Ordnungsprinzip, bei dem Archivgut nach seiner Herkunft (der abgebenden Behörde/Institution) zusammengehalten wird.", "cat": 1}, {"q": "Sind historische deutsche Luftbilder aus dem Zweiten Weltkrieg heute noch lückenlos vorhanden?", "a": "Nein, viele gingen im Krieg verloren, daher müssen oft alliierte Aufklärungsbilder aus ausländischen Archiven herangezogen werden.", "cat": 1}, {"q": "Wie sollten Aussagen von Zeitzeugen in der Erkundung behandelt werden?", "a": "Sie sind wertvoll, müssen aber aufgrund möglicher Erinnerungslücken oder Verdrängung stets mit anderen Quellen (z.B. Luftbildern) abgeglichen werden.", "cat": 1}, {"q": "Warum ist eine Geländebegehung am Ende von Phase A vorgeschrieben?", "a": "Um die theoretischen Erkenntnisse aus den Archiven mit den realen örtlichen Gegebenheiten zu verifizieren.", "cat": 1}, {"q": "Welche Eigenschaften von Splitterbomben erschweren deren Luftbildauswertung?", "a": "Sie verursachen aufgrund ihrer geringen Größe oft nur sehr kleine, schwer identifizierbare Trichter, die schnell überwuchern.", "cat": 2}, {"q": "Was war der Auslöser für den Einsatz von Langzeitzündern bei alliierten Bombenangriffen?", "a": "Sie dienten dazu, Lösch- und Bergungsarbeiten nach dem eigentlichen Angriff zu behindern und moralischen Druck auszuüben.", "cat": 2}, {"q": "Warum stellen Langzeitzünder heute noch ein besonders hohes Risiko dar?", "a": "Weil chemisch-mechanische Alterungsprozesse dazu führen können, dass bereits geringste Erschütterungen die Detonation auslösen.", "cat": 2}, {"q": "Wann fanden in Deutschland im 20. Jahrhundert in nennenswertem Umfang Bodenkämpfe statt?", "a": "Nur in der Endphase des Zweiten Weltkriegs, ab Ende 1944 bis Mai 1945.", "cat": 1}, {"q": "Warum sind Minenfelder aus den letzten Kriegswochen oft kaum dokumentiert?", "a": "Weil sie auf dem Rückzug eilig, teils ohne Schema (Streueinsatz) verlegt wurden und die Aufzeichnungspflichten vernachlässigt wurden.", "cat": 1}, {"q": "Was geschah nach Ende beider Weltkriege im Rahmen von Demilitarisierungen häufig mit aufgefundener Munition?", "a": "Sie wurde von Alliierten oder deutschen Stellen großflächig an Sammelplätzen gesprengt, was oft zu starker Streuung unverbrannter Restmunition führte.", "cat": 1}, {"q": "Was versteht man unter dem Verursachungsszenarium 'Munitionsvernichtung'?", "a": "Kampfmittelbelastungen durch Nachkriegssprengungen, Ablagerungen, Versenkung in Gewässern oder Manipulationen von Zivilisten zwecks Wertstoffgewinnung.", "cat": 1}, {"q": "Was ist unter dem Verursachungsszenarium 'Militärischer Regelbetrieb' zu verstehen?", "a": "Belastungen, die durch reguläre Waffen-, Schieß- oder Pionierausbildung in Kasernen, Schießständen und auf Truppenübungsplätzen entstanden sind.", "cat": 1}, {"q": "Welchen Vorteil hat die zentrale Beschaffung von Luftbildern durch das NLBL?", "a": "Vermeidung von Mehrfachkosten, direkter Zugriff auf bereits digitalisierte Bestände und hohe fachliche Qualitätskontrolle der Aufnahmen.", "cat": 1}, {"q": "Muss für jede Kampfmittelräumung in Sachsen-Anhalt eine staatliche Stelle eingeschaltet werden?", "a": "Ja, zur Einholung der Kampfmittelfreigabe über die Sicherheitsbehörde, wobei der staatliche KBD oder zertifizierte Firmen räumen.", "cat": 1}, {"q": "Ist der Grundstückseigentümer in Bayern gezwungen, die Freigabe des Kampfmittelräumdienstes einzuholen?", "a": "Nein, der KBD Bayern wird in der Regel nur zur Entsorgung gerufener Kampfmittel aktiv; Erkundung und Räumung muss der Bauherr über Privatfirmen organisieren.", "cat": 1}, {"q": "Welche Behörde ist im Land Brandenburg für das Kampfmittelkataster und amtliche Freigabebescheinigungen zuständig?", "a": "Der Kampfmittelbeseitigungsdienst (KMBD) beim Zentraldienst der Polizei.", "cat": 1}, {"q": "Wie ist der Kampfmittelräumdienst in Bremen institutionell verankert?", "a": "Er ist direkt bei der Polizei Bremen angesiedelt und arbeitet kostenfrei als Gefahrenabwehrbehörde.", "cat": 1}, {"q": "Wie geht Hamburg bei der Gefahrenerkundung vor?", "a": "Bauherren müssen bei der Feuerwehr (Referat F 046) anfragen; geräumt wird dann gezielt nach Maßgabe technischer Vorsorgemaßnahmen.", "cat": 1}, {"q": "In welchem Bundesland liegt die operative Kampfmittelbeseitigung oft in Händen privater Rahmenvertragsfirmen?", "a": "In vielen, z.B. Bayern oder Thüringen (wo Firma Tauber jahrelang als Generalunternehmer die Entsorgung durchführte).", "cat": 1}, {"q": "Übernimmt das Land Niedersachsen Kosten für privat veranlasste Suchmaßnahmen im Vorfeld von Bauarbeiten?", "a": "Nein, die Kosten für Luftbildauswertung, Sondierung und Freilegung tragen die Eigentümer/Bauherren; lediglich Abtransport und Vernichtung durch den LGLN-KBD ist kostenfrei.", "cat": 1}, {"q": "Was ist bei der Kampfmittelräumung in Nordrhein-Westfalen die Aufgabe der Ordnungsbehörde?", "a": "Sie ist die örtlich zuständige Gefahrenabwehrbehörde, an die sich Bauherren wenden, welche dann den KBD bei den Bezirksregierungen hinzuzieht.", "cat": 1}, {"q": "Ist die Luftbildauswertung durch den KBD in Rheinland-Pfalz gebührenfrei für private Bauherren?", "a": "Der staatliche KMRD wird in RLP nur bei konkreten Gefahren tätig; routinemäßige Luftbildauswertungen für Baugebiete müssen privat beauftragt werden.", "cat": 1}, {"q": "Wer trägt im Saarland die Kosten für Baggerarbeiten zur Freilegung einer Weltkriegsbombe auf einem Privatgrundstück?", "a": "Die Vorarbeiten und Freilegungen (Bagger etc.) gehen zu Lasten des Bauherren; die Entschärfung und Vernichtung trägt das Land.", "cat": 1}, {"q": "Welche Institution vertritt das Land Schleswig-Holstein in Kampfmittelfragen?", "a": "Das Landeskriminalamt (Dezernat 33 – Kampfmittelräumdienst).", "cat": 1}, {"q": "Können in Thüringen Kommunen Kosten für die Beseitigung ehemals reichseigener Munition geltend machen?", "a": "Ja, das Thüringer Landesverwaltungsamt reicht diese Anträge aus Billigkeitsgründen nach der Staatspraxis an den Bund (BImA) weiter.", "cat": 1}, {"q": "Wo befinden sich in Deutschland heute noch Munitionsversenkungsgebiete aus der Nachkriegszeit?", "a": "In verschiedenen dokumentierten Arealen in Nord- und Ostsee sowie in einigen Binnengewässern.", "cat": 1}, {"q": "Wer haftet primär für Schäden durch Kampfmittel auf seinem Grundstück?", "a": "Nach allgemeinem Polizei- und Ordnungsrecht der Zustandsstörer, also der Grundstückseigentümer oder der Inhaber der tatsächlichen Gewalt.", "cat": 1}, {"q": "Dürfen bei der Räumung eingesetzte Firmen frei über gefundene Kampfmittel verfügen?", "a": "Nein, nach Identifizierung und Bergung müssen unbrauchbare oder gefährliche Kampfmittel zwingend dem Kampfmittelbeseitigungsdienst zur Vernichtung überlassen werden.", "cat": 1}, {"q": "Gibt es auf Bundesebene ein einheitliches 'Kampfmittelgesetz'?", "a": "Nein, die Regelungen, Kostenverteilungen und Zuständigkeiten basieren auf den Polizei- und Ordnungsgesetzen der 16 Bundesländer sowie der Staatspraxis (Art. 120 GG).", "cat": 1}, {"q": "Was regelt die 'Staatspraxis' bezüglich alliierter Munition auf Landesgrundstücken?", "a": "Dass die Länder grundsätzlich die Kosten für die Räumung ehemals alliierter Kampfmittel auf nicht-bundeseigenen Grundstücken tragen, wenn keine Ausnahmen bestehen.", "cat": 1}, {"q": "Ist die Beauftragung einer Kampfmittelräumfirma in Phase C ohne vorheriges Räumkonzept zulässig?", "a": "Nein, nach den BFR KMR ist vor der Ausschreibung gewerblicher Leistungen zwingend ein Räumkonzept (Phase C1) zu erstellen.", "cat": 1}];
        let currentCluster = [];
        
        function setMode(mode) {
            document.querySelectorAll('.btn-category').forEach(btn => btn.classList.remove('active'));
            if (mode === 'all') {
                document.getElementById('btn-all').classList.add('active');
                currentCluster = qaData;
            } else {
                document.getElementById('btn-' + mode).classList.add('active');
                currentCluster = qaData.filter(item => item.cat === mode);
            }
            
            document.getElementById('clusterInfo').innerText = currentCluster.length + " Fragen in diesem Bereich";
            nextQuestion();
        }
        
        function nextQuestion() {
            if (!currentCluster || currentCluster.length === 0) {
                document.getElementById('questionText').innerText = "Keine Fragen in dieser Kategorie gefunden.";
                document.getElementById('answerText').innerText = "";
                document.getElementById('btnAnswer').style.display = 'none';
                return;
            }
            const randomIndex = Math.floor(Math.random() * currentCluster.length);
            const currentQuestion = currentCluster[randomIndex];
            
            document.getElementById('questionText').innerText = currentQuestion.q;
            document.getElementById('answerText').innerText = currentQuestion.a;
            
            document.getElementById('answerText').style.display = 'none';
            document.getElementById('btnAnswer').style.display = 'inline-block';
        }

        function showAnswer() {
            document.getElementById('answerText').style.display = 'block';
            document.getElementById('btnAnswer').style.display = 'none';
        }
        
        setMode('all');
    </script>
</body>
</html>
